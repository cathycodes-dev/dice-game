[tool.black]
line-length = 88
target-version = ['py310']

[tool.isort]
profile = "black"
line_length = 88
known_first_party = ["async_helper", "dice", "main", "player"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
pythonpath = ["site/src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"