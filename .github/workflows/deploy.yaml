name: "Deploy Game Files to S3"

on:
  push:
    branches:
      - main

concurrency:
  group: terraform-state-lock
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  deploy-game:
    runs-on: ubuntu-latest
    
    # Set workspace globally
    defaults:
      run:
        working-directory: terraform

    env:
      PROJECT_NAME: dice-game
      AWS_REGION: us-east-1
      AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}

    steps:
      - name: Checkout Game Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ secrets.AWS_ACCOUNT_ID }}:role/GitHubAction-AssumeRoleWithAction
          role-session-name: GitHub_to_AWS_via_FederatedOIDC
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.0

      # All Terraform steps below automatically run inside /terraform
      - name: Terraform Fmt
        id: fmt
        run: terraform fmt -check
        continue-on-error: false

      - name: Terraform init
        id: init
        run: |
          terraform init -lock-timeout=2m \
            -backend-config="region=$AWS_REGION" \
            -backend-config="key=$PROJECT_NAME/terraform.tfstate"
        env:
          TF_VAR_assume_role: "GitHubAction-AssumeRoleWithAction"

      - name: Terraform validate
        id: validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color
        env:
          TF_VAR_assume_role: "GitHubAction-AssumeRoleWithAction"

      - name: Plan output
        id: output
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        env:
          PLAN: "terraform\n${{ steps.plan.outputs.stdout }}"
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const output = `#### Terraform Format and Style 🖌\`${{ steps.fmt.outcome }}\`
            ### Workspace

            \`${process.env.TF_WORKSPACE}\`

            #### Terraform Initialization ⚙️\`${{ steps.init.outcome }}\`
            #### Terraform Plan 📖\`${{ steps.plan.outcome }}\`
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${process.env.PLAN}
            \`\`\`

            </details>

            **Pusher**: @${{ github.actor }}
            **Action**: ${{ github.event_name }}
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            })

      - name: Terraform apply
        id: apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -auto-approve -input=false
        env:
          TF_VAR_assume_role: "GitHubAction-AssumeRoleWithAction"

      - name: Sync Game to S3
        run: aws s3 sync ${{ env.PROJECT_NAME }}/ s3://${{ env.PROJECT_NAME }}-repo/${{ env.PROJECT_NAME }}/ --delete
        working-directory: .
